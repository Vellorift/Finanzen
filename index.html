<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Meine Finanzen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* ===== Farben (Dark Mode) – hier kannst du alles umfärben =====
     --akzent wird in den Einstellungen gewählt (app.js → AKZENTE) */
  :root {
    --bg:#0b0d11; --karte:#14171d; --karte2:#1c2028; --karte3:#272c36;
    --rand:rgba(255,255,255,.07); --rand2:rgba(255,255,255,.13);
    --text:#eef0f3; --grau:#8b93a1; --grau2:#5d6470;
    --akzent:#8f7cff; --akzent-weich:rgba(143,124,255,.16); --akzent-text:#0b0d11;
    --rot:#ff6b6b; --gruen:#3ddc97; --blau:#5aa9ff; --gelb:#ffd166;
    --radius:20px;
  }
  /* AMOLED: echtes Schwarz (spart Akku auf OLED-Displays) */
  html.amoled { --bg:#000; --karte:#0c0e12; --karte2:#15181e; --karte3:#20242c; }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding-bottom:calc(104px + env(safe-area-inset-bottom)); overscroll-behavior-y:none; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--akzent); }
  .ic { width:1.25em; height:1.25em; vertical-align:-.25em; flex:none; fill:none; stroke:currentColor;
    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* Kopfzeile mit Monatswechsel */
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center;
    justify-content:space-between; gap:6px; background:var(--bg);
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px; }
  header h1 { margin:0; font-size:1.1rem; font-weight:650; flex:1; text-align:center; letter-spacing:-.2px; }
  .pfeil, .kopf-knopf { background:var(--karte); border:1px solid var(--rand); border-radius:14px; width:42px; height:40px;
    font-size:1.4rem; display:flex; align-items:center; justify-content:center; color:var(--text); }
  .kopf-knopf.aktiv { color:var(--akzent); border-color:var(--akzent); }

  main { padding:4px 12px 12px; max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  main.einblenden { animation:einblenden .28s ease-out; }
  @keyframes einblenden { from { opacity:0; transform:translateY(6px); } }

  /* Karten */
  .karte { background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0) 70%), var(--karte);
    border:1px solid var(--rand); border-radius:var(--radius); padding:16px 18px; }
  .karte h2 { margin:0 0 12px; font-size:.92rem; color:var(--grau); font-weight:600; display:flex; align-items:center; gap:8px; }
  .karte h2 .ic { color:var(--akzent); }
  .label { color:var(--grau); font-size:.88rem; }
  .zahl { font-size:2.2rem; font-weight:750; letter-spacing:-.8px; margin:2px 0 8px; font-variant-numeric:tabular-nums; }
  .zahl.mittel { font-size:1.6rem; }
  .ct { font-size:.6em; opacity:.55; font-weight:600; letter-spacing:0; }
  .klein { font-size:.85rem; } .grau { color:var(--grau); }
  .rot { color:var(--rot); } .gruen { color:var(--gruen); } .blau { color:var(--blau); } .gelb { color:var(--gelb); }
  .akzent { color:var(--akzent); }
  .raster { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .raster .karte { padding:12px 14px; }
  .wert { font-size:1.2rem; font-weight:650; font-variant-numeric:tabular-nums; }
  .leiste { height:10px; border-radius:5px; background:var(--karte3); overflow:hidden; display:flex; margin:6px 0; }
  .leiste > span { display:block; height:100%; border-radius:5px; transition:width .6s ease; }
  .zeile { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .katzeile { margin:12px 0; }
  .punkt { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; flex:none; }
  .hinweis { display:block; width:100%; text-align:left; background:var(--akzent-weich); border:1px solid var(--rand2);
    color:var(--text); border-radius:16px; padding:12px 14px; }
  .hinweis.warn { background:rgba(255,209,102,.1); border-color:rgba(255,209,102,.3); }
  .hinweis.fertig { background:rgba(61,220,151,.1); border-color:rgba(61,220,151,.3); }
  .einmalig-box { background:var(--karte2); border-radius:14px; padding:10px 12px 12px; margin:10px 0 4px; }
  .einmalig-box .knopf { background:var(--karte3); }
  .leer { text-align:center; color:var(--grau); padding:30px 10px; }
  .tippbar { cursor:pointer; }
  .badge { display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:10px; background:var(--karte3); color:var(--grau); font-weight:600; vertical-align:2px; }
  .trenner { height:1px; background:var(--rand); margin:12px 0; }

  /* Hero-Karte: Geld, das diesen Monat noch frei ist */
  .hero { background:radial-gradient(130% 150% at 0% 0%, var(--akzent-weich), rgba(0,0,0,0) 60%), var(--karte); }
  .hero .zahl { font-size:2.7rem; margin:0 0 10px; }
  .hero-unten { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .hero-unten b { font-variant-numeric:tabular-nums; }

  /* Ziel-Karten oben (wischbar, drehen automatisch weiter) */
  .ziele { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:12px; scrollbar-width:none;
    margin:0 -12px; padding:0 12px; }
  .ziele::-webkit-scrollbar { display:none; }
  .zielkarte { flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always; position:relative; overflow:hidden;
    background:radial-gradient(120% 120% at 100% 0%, var(--akzent-weich), rgba(0,0,0,0) 55%), var(--karte); }
  .zielkarte .ziel-kopf { display:flex; gap:14px; align-items:center; }
  .zielkarte .ziel-name { font-size:1.35rem; font-weight:750; letter-spacing:-.4px; line-height:1.15; }
  .zielkarte .ziel-emoji { font-size:1.4rem; }
  .punkte { display:flex; justify-content:center; gap:6px; margin-top:-4px; }
  .punkte i { width:6px; height:6px; border-radius:3px; background:var(--karte3); transition:all .25s; }
  .punkte i.an { width:18px; background:var(--akzent); }
  .ring { flex:none; }
  .ring circle { transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
  .ampel { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  .ampel.gruen { background:var(--gruen); } .ampel.gelb { background:var(--gelb); } .ampel.rot { background:var(--rot); }

  /* Buchungsliste */
  .tag { color:var(--grau); font-size:.82rem; margin:10px 6px 2px; font-weight:600; display:flex; justify-content:space-between; }
  .buchung-wrap { position:relative; border-radius:16px; overflow:hidden; margin-bottom:6px; }
  .loesch-hg { position:absolute; inset:0; background:var(--rot); color:#fff; display:flex; align-items:center;
    justify-content:flex-end; padding-right:22px; font-weight:600; gap:6px; }
  .buchung { position:relative; display:flex; align-items:center; gap:12px; width:100%; background:var(--karte); border:1px solid var(--rand);
    border-radius:16px; padding:12px; text-align:left; touch-action:pan-y; }
  .buchung.gleitet { transition:transform .25s ease; }
  .buchung .mitte { flex:1; min-width:0; }
  .buchung .notiz { color:var(--grau); font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .buchung .betrag { font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .kat-symbol { width:36px; height:36px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    flex:none; font-weight:700; font-size:.95rem; }
  .suche { display:flex; gap:8px; align-items:center; }
  .suche input { flex:1; }
  .such-knopf { flex:none; width:46px; height:46px; border:1px solid var(--rand2); background:var(--karte); border-radius:12px;
    color:var(--akzent); display:inline-flex; align-items:center; justify-content:center; }

  /* Navigation unten (schwebend) mit rundem Plus-Knopf in der Mitte */
  nav.unten { position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:6;
    display:grid; grid-template-columns:repeat(5,1fr); align-items:end; max-width:620px; margin:0 auto;
    background:rgba(20,23,29,.9); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--rand2); border-radius:26px; padding:6px 4px; }
  html.amoled nav.unten { background:rgba(12,14,18,.92); }
  nav.unten button { background:none; border:0; color:var(--grau); font-size:.68rem; display:flex;
    flex-direction:column; align-items:center; gap:3px; padding:2px 0; }
  nav.unten .pille { display:flex; align-items:center; justify-content:center; width:54px; height:30px;
    border-radius:15px; transition:background .2s, color .2s; }
  nav.unten .pille .ic { width:22px; height:22px; }
  nav.unten button.aktiv { color:var(--text); }
  nav.unten button.aktiv .pille { background:var(--akzent-weich); color:var(--akzent); }
  nav.unten .fab { width:58px; height:58px; border-radius:50%; background:var(--akzent); color:var(--akzent-text);
    margin:-30px auto 8px; box-shadow:0 8px 22px rgba(0,0,0,.55), 0 0 0 5px var(--bg); display:flex;
    align-items:center; justify-content:center; padding:0; }
  nav.unten .fab .ic { width:28px; height:28px; stroke-width:2.6; }
  nav.unten .fab:active { transform:scale(.94); }

  /* Eingabe als "Bottom Sheet" (schiebt sich von unten hoch) */
  .sheet-hg { position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.6); opacity:0; transition:opacity .25s; }
  .sheet-hg.offen { opacity:1; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:20; max-height:94dvh; overflow-y:auto; max-width:680px; margin:0 auto;
    background:var(--bg); border-radius:26px 26px 0 0; border-top:1px solid var(--rand2);
    padding:6px 16px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%);
    transition:transform .32s cubic-bezier(.2,.8,.2,1); overscroll-behavior:contain; }
  .sheet.offen { transform:none; }
  .griff { width:42px; height:5px; border-radius:3px; background:var(--karte3); margin:4px auto 12px; }
  .sheet-kopf { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .sheet-kopf h1 { margin:0; font-size:1.2rem; }
  .segment { display:grid; grid-template-columns:repeat(3,1fr); background:var(--karte); border:1px solid var(--rand); border-radius:14px; padding:4px; gap:4px; }
  .segment.zwei-teile { grid-template-columns:1fr 1fr; }
  .segment button { border:0; background:none; padding:10px 6px; border-radius:10px; color:var(--grau); font-weight:600; }
  .segment button.an { background:var(--karte3); color:var(--text); }
  .betrag-eingabe { width:100%; font-size:2.4rem; font-weight:750; text-align:center; background:none; border:0;
    border-bottom:2px solid var(--rand2); padding:10px 0; margin:14px 0; outline:none; font-variant-numeric:tabular-nums; }
  .betrag-eingabe:focus { border-color:var(--akzent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 16px; }
  .chip { border:1px solid var(--rand2); background:var(--karte); border-radius:20px; padding:8px 14px; display:flex; align-items:center; gap:4px; }
  .chip.an { border-color:var(--akzent); background:var(--akzent-weich); }
  .chip.schnell { border-style:dashed; }
  .feld { display:block; margin-bottom:12px; }
  .feld > span { display:block; color:var(--grau); font-size:.85rem; margin-bottom:4px; }
  input[type=text], input[type=number], input[type=password], input[type=search], select, textarea { width:100%; background:var(--karte);
    border:1px solid var(--rand2); border-radius:12px; padding:11px 12px; outline:none; }
  .karte input[type=text], .karte input[type=password], .karte input[type=search], .karte select { background:var(--karte2); }
  input:focus, select:focus, textarea:focus { border-color:var(--akzent); }
  input[type=range] { width:100%; accent-color:var(--akzent); }
  .knopf { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; border:0; border-radius:14px; padding:14px; font-weight:650; background:var(--karte2); }
  .karte .knopf { background:var(--karte3); }
  .knopf.haupt, .karte .knopf.haupt { background:var(--akzent); color:var(--akzent-text); }
  .knopf.gefahr, .karte .knopf.gefahr { background:none; color:var(--rot); border:1px solid rgba(255,107,107,.35); }
  .knopf.klein { padding:9px 12px; font-size:.88rem; width:auto; }
  .knopfreihe { display:flex; gap:8px; margin-top:8px; }
  .knopfreihe .knopf { flex:1; }
  .check { display:flex; align-items:center; gap:10px; margin:4px 0 16px; }
  .check input { width:20px; height:20px; accent-color:var(--akzent); }

  /* Einstellungen */
  .unter { font-size:.85rem; color:var(--grau); margin:14px 0 8px; font-weight:600; }
  .katedit { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .katedit input[type=color] { width:36px; height:36px; border:0; padding:0; background:none; flex:none; }
  .katedit input[type=text] { flex:1; min-width:0; }
  .katedit label { font-size:.8rem; color:var(--grau); display:flex; align-items:center; gap:4px; flex:none; }
  .x { border:0; background:var(--karte3); border-radius:11px; width:36px; height:36px; flex:none; color:var(--grau);
    display:inline-flex; align-items:center; justify-content:center; }
  .x.an { color:var(--gelb); }
  .x.akzent { color:var(--akzent); }
  .kopf-knoepfe { display:flex; gap:8px; }
  .x.an .ic { fill:currentColor; }
  .zwei { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .farbwahl { display:flex; gap:10px; margin:6px 0 14px; }
  .farbwahl button { width:38px; height:38px; border-radius:50%; border:3px solid transparent; }
  .farbwahl button.an { border-color:var(--text); }

  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(100px + env(safe-area-inset-bottom));
    background:#eef0f3; color:#111; padding:10px 18px; border-radius:22px; z-index:40; font-weight:600;
    display:flex; align-items:center; gap:14px; max-width:92vw; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  #toast button { border:0; background:none; color:#5b47e0; font-weight:750; padding:0; }
  [hidden] { display:none !important; }
  /* Abgleich-Status (Punkt neben dem Monat) */
  .sync-punkt { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:middle; margin-left:4px; cursor:pointer; }
  .sync-ok { background:var(--gruen); } .sync-laeuft { background:var(--blau); animation:puls 1s infinite; }
  .sync-offline { background:var(--grau); } .sync-fehler { background:var(--rot); }
  @keyframes puls { 50% { opacity:.3; } }
  .knopf:disabled { opacity:.6; }
  /* Kalender */
  .kalender { background:var(--karte); border:1px solid var(--rand); border-radius:16px; padding:10px; margin:0 0 14px; }
  .kal-raster { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .kal-kopf { text-align:center; color:var(--grau); font-size:.8rem; padding:4px 0; }
  .kal-tag { height:44px; border:0; border-radius:12px; background:none; font-size:1.05rem; }
  .kal-tag.heute { box-shadow:inset 0 0 0 1px var(--akzent); }
  .kal-tag.an { background:var(--akzent); color:var(--akzent-text); font-weight:700; }
  .kal-pfeil { background:var(--karte2); border:0; border-radius:12px; width:44px; height:40px; font-size:1.5rem; }
  .monatwahl { margin:6px 0 4px; }
  .ausblick-monat { padding:10px 0; border-bottom:1px solid var(--rand); }
  .ausblick-monat:last-child { border-bottom:0; }
  .bearbeiten-box { border:1px solid var(--akzent); border-radius:14px; padding:4px 12px 12px; margin-top:12px; }
  .tagwahl { margin:6px 0 14px; align-items:center; }
  .tagwahl .chip { padding:8px 12px; }
  /* Screenshot-Import */
  .imp-zeile { border:1px solid var(--rand2); border-radius:16px; padding:10px; margin-bottom:10px; background:var(--karte); transition:opacity .2s; }
  .imp-zeile.aus { opacity:.45; }
  .imp-kopf { display:flex; align-items:center; gap:10px; }
  .imp-kopf input[type=checkbox] { width:22px; height:22px; flex:none; accent-color:var(--akzent); }
  .imp-kopf input[type=text] { font-weight:600; }
  .imp-felder { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .imp-felder select { grid-column:1 / -1; }
  .imp-betrag { display:flex; align-items:center; gap:4px; font-weight:700; }
  .imp-betrag input { text-align:right; font-weight:700; color:inherit; }
  .imp-zeile input, .imp-zeile select { background:var(--karte2); }
  input.fehler { border-color:var(--rot); }
  .imp-roh { white-space:pre-wrap; font-size:.75rem; color:var(--grau); max-height:240px; overflow:auto; }
  .imp-text-box summary { cursor:pointer; padding:6px 0; }
  .imp-dreh { display:inline-block; width:12px; height:12px; border:2px solid var(--blau); border-right-color:transparent; border-radius:50%; animation:drehen .8s linear infinite; vertical-align:-1px; }
  @keyframes drehen { to { transform:rotate(360deg); } }
  .text-knopf { display:block; width:100%; margin-top:10px; padding:10px; border:0; background:none; color:var(--grau); font-size:.85rem; }
  .text-knopf .ic { width:14px; height:14px; vertical-align:-2px; }
  /* Format beibringen */
  .lern-segment { grid-template-columns:repeat(5,1fr); margin-bottom:10px; }
  .lern-segment button { padding:9px 2px; font-size:.78rem; }
  .lern-segment button.an.lern-betrag { color:var(--rot); } .lern-segment button.an.lern-name { color:var(--akzent); }
  .lern-segment button.an.lern-datum { color:var(--blau); } .lern-segment button.an.lern-zweck { color:var(--gruen); }
  .lern-liste { display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow:auto; padding:2px; }
  .lern-zeile { text-align:left; border:1px solid var(--rand2); background:var(--karte); color:var(--text); border-radius:12px; padding:9px 11px; font-size:.85rem; line-height:1.35; word-break:break-word; }
  .lern-zeile.lern-betrag { border-color:var(--rot); } .lern-zeile.lern-name { border-color:var(--akzent); }
  .lern-zeile.lern-datum { border-color:var(--blau); } .lern-zeile.lern-zweck { border-color:var(--gruen); }
  .lern-zeile.lern-ignorieren { opacity:.4; text-decoration:line-through; }
  .lern-tag { display:inline-block; font-size:.68rem; font-weight:700; padding:1px 7px; border-radius:8px; margin-right:6px; background:var(--karte3); vertical-align:1px; }
  .lern-tag.lern-betrag { color:var(--rot); } .lern-tag.lern-name { color:var(--akzent); } .lern-tag.lern-datum { color:var(--blau); }
  .lern-tag.lern-zweck { color:var(--gruen); } .lern-tag.lern-ignorieren { color:var(--grau); }
  .lern-format { padding:8px 0; border-bottom:1px solid var(--rand); }
  .tagwahl .tag-eingabe { width:80px; flex:none; }
  .erweitert { background:var(--karte2); border-radius:14px; padding:10px 12px; margin-bottom:12px; }
  .erweitert summary { cursor:pointer; color:var(--akzent); font-weight:600; }

  /* Wünsche */
  .wunsch { cursor:pointer; }
  .wunsch .wunsch-kopf { display:flex; gap:10px; align-items:flex-start; }
  .wunsch .wunsch-emoji { font-size:1.6rem; line-height:1; width:40px; height:40px; border-radius:13px; background:var(--karte2);
    display:flex; align-items:center; justify-content:center; flex:none; }
  .ampel-box { border-radius:14px; padding:10px 12px; margin:10px 0; background:var(--karte2); }
  .ampel-box.gruen { background:rgba(61,220,151,.1); } .ampel-box.gelb { background:rgba(255,209,102,.1); } .ampel-box.rot { background:rgba(255,107,107,.1); }
  .teil { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--rand); }
  .teil:last-child { border-bottom:0; }
  .teil.erledigt .teil-name { text-decoration:line-through; color:var(--grau); }

  /* Auswertung */
  .balken-reihe { display:flex; align-items:flex-end; gap:6px; height:110px; position:relative; margin:10px 0 4px; }
  .balken-reihe .b { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .balken-reihe .b span { width:100%; border-radius:6px 6px 2px 2px; min-height:2px; }
  .balken-reihe .richtwert { position:absolute; left:0; right:0; border-top:1px dashed var(--grau2); background:rgba(61,220,151,.06); }
  .balken-unter { display:flex; gap:6px; }
  .balken-unter span { flex:1; text-align:center; font-size:.7rem; color:var(--grau); }

  /* Start-Bildschirm & Sperre */
  .vollbild { position:fixed; inset:0; z-index:50; background:#0b0d11; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px; gap:14px; transition:opacity .45s, transform .45s; }
  html.amoled .vollbild { background:#000; }
  .vollbild.weg { opacity:0; transform:scale(1.04); pointer-events:none; }
  .vollbild .gross { font-size:1.7rem; font-weight:750; letter-spacing:-.5px; }
  #sperre { z-index:60; }

  /* Konfetti bei Meilensteinen */
  .konfetti { position:fixed; top:-10px; width:8px; height:14px; z-index:70; border-radius:2px; pointer-events:none;
    animation:fallen 1.8s ease-in forwards; }
  @keyframes fallen { to { transform:translateY(105vh) rotate(720deg); opacity:.7; } }
  /* Einstellungen: aufklappbare Bereiche + Suche */
  .kopf-knopf[hidden], .pfeil[hidden] { display:none; }
  .einst-gruppe { color:var(--grau); font-size:.78rem; font-weight:650; text-transform:uppercase; letter-spacing:.8px; margin:6px 4px -4px; }
  .karte.bereich { padding:0; overflow:hidden; }
  .bereich-kopf { display:flex; align-items:center; gap:12px; width:100%; background:none; border:0; color:var(--text);
    padding:14px 16px; text-align:left; font:inherit; cursor:pointer; }
  .bereich-ic { width:36px; height:36px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--akzent) 16%, transparent); color:var(--akzent); }
  .bereich-ic .ic { color:var(--akzent); }
  .bereich-text { flex:1; display:flex; flex-direction:column; min-width:0; }
  .bereich-text b { font-weight:620; font-size:.98rem; }
  .bereich-text span { color:var(--grau); font-size:.8rem; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bereich-pfeil { color:var(--grau); display:flex; transition:transform .2s; }
  .bereich.offen .bereich-pfeil { transform:rotate(180deg); }
  .bereich-inhalt { display:none; padding:4px 18px 16px; border-top:1px solid var(--rand); }
  .bereich.offen .bereich-inhalt { display:block; animation:einblenden .22s ease-out; }
  .bereich-inhalt > :first-child { margin-top:12px; }
  .such-aus { display:none !important; }
  .einst-suche { position:sticky; top:calc(60px + env(safe-area-inset-top)); z-index:4; display:flex; align-items:center; gap:8px;
    background:var(--karte); border:1px solid var(--akzent); border-radius:14px; padding:4px 6px 4px 12px; color:var(--grau); }
  .einst-suche input { flex:1; background:none; border:0; outline:none; padding:8px 0; color:var(--text); font:inherit; min-width:0; }
  .einst-leer { text-align:center; padding:20px; }
</style>
</head>
<body>
  <header>
    <button class="pfeil" data-action="monat-zurueck" aria-label="Vorheriger Monat">‹</button>
    <h1 id="titel"><span id="titel-text">Meine Finanzen</span> <span id="sync-anzeige" data-view="einstellungen"></span></h1>
    <button class="pfeil" data-action="monat-vor" aria-label="Nächster Monat">›</button>
    <button class="kopf-knopf" id="einst-such-knopf" data-action="einst-suche" aria-label="Einstellungen durchsuchen" hidden></button>
    <button class="kopf-knopf" id="einst-knopf" data-view="einstellungen" aria-label="Einstellungen"></button>
  </header>

  <main id="inhalt"></main>

  <!-- wird von app.js gefüllt (navAufbauen) -->
  <nav class="unten"></nav>

  <div id="sheet-hg" class="sheet-hg" data-action="form-schliessen" hidden></div>
  <div id="formular" class="sheet" hidden></div>
  <div id="toast" hidden></div>
  <input type="file" id="import-datei" accept=".json,.txt,application/json,text/plain" hidden>

  <script src="app.js"></script>
</body>
</html>
